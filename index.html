<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elongator</title>
    <style>
        :root {
            --bg-base: #000000;
            --bg-panel: #09090b;
            --border-subtle: #1f1f23;
            --border-active: #3f3f46;
            --text-pure: #ffffff;
            --text-muted: #71717a;
            --text-ghost: #27272a;
            --font-mono: "SF Mono", SFMono-Regular, ui-monospace, Menlo, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-pure);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .stage {
            width: 100%;
            max-width: 580px;
        }

        .monolith {
            background: var(--bg-panel);
            border: 1px solid var(--border-subtle);
            padding: 48px;
            position: relative;
            transition: border-color 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .monolith:hover {
            border-color: var(--border-active);
        }

        .meta-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 40px;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--text-muted);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            color: var(--text-pure);
            margin-bottom: 32px;
            line-height: 1.2;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 40px;
        }

        input[type="text"] {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-subtle);
            padding: 16px 0;
            color: var(--text-pure);
            font-family: var(--font-mono);
            font-size: 1.15rem;
            outline: none;
            transition: all 0.4s;
            border-radius: 0;
        }

        input[type="text"]:focus {
            border-color: var(--text-pure);
        }

        input[type="text"]::placeholder {
            color: var(--text-ghost);
        }

        /* 未入力時の控えめな脈動（インジケータ） */
        @keyframes borderPulse {
            0% { border-bottom-color: var(--border-subtle); }
            50% { border-bottom-color: var(--border-active); }
            100% { border-bottom-color: var(--border-subtle); }
        }
        input[type="text"].error-pulse {
            animation: borderPulse 0.4s ease;
        }

        .trigger-zone {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hint-text {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .btn-elongate {
            background: var(--text-pure);
            color: var(--bg-base);
            border: 1px solid var(--text-pure);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding: 16px 36px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-elongate:hover {
            background: transparent;
            color: var(--text-pure);
        }

        #result-box {
            margin-top: 48px;
            border-top: 1px dashed var(--border-subtle);
            padding-top: 32px;
            animation: paneReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .result-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .result-title {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
        }

        /* ミニマルで実用的なキャプチャボタン */
        .btn-capture {
            background: transparent;
            border: none;
            color: var(--text-pure);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            padding: 6px 14px;
            border: 1px solid var(--border-subtle);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-capture:hover {
            border-color: var(--text-pure);
        }

        /* コピー成功時はボタン単体が静かに反転する、ノイズのない仕様 */
        .btn-capture.copied {
            background: var(--text-pure);
            color: var(--bg-base);
            border-color: var(--text-pure);
        }

        .output-viewport {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--border-subtle);
            padding: 24px;
        }

        #result {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            line-height: 1.7;
            color: var(--text-muted);
            word-break: break-all;
            max-height: 140px;
            overflow-y: auto;
        }

        /* 自然で洗練された転送画面 */
        #redirector-view {
            text-align: center;
            padding: 80px 0;
        }

        .quantum-field {
            width: 120px;
            height: 120px;
            margin: 0 auto 32px auto;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .quantum-core {
            width: 2px;
            height: 32px;
            background: var(--text-pure);
            animation: corePulse 1.6s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        }

        .quantum-wave {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 1px solid var(--border-subtle);
            animation: waveExpand 2.4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        }

        .redirect-status {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-pure);
            margin-bottom: 8px;
        }

        .redirect-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: -0.01em;
        }

        @keyframes paneReveal {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes corePulse {
            0%, 100% { transform: scaleY(0.5); opacity: 0.4; }
            50% { transform: scaleY(1.3); opacity: 1; }
        }

        @keyframes waveExpand {
            0% { transform: scale(0.3); opacity: 1; border-color: var(--border-active); }
            100% { transform: scale(1.1); opacity: 0; border-color: transparent; }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="stage">
        <div id="generator-view" class="monolith">
            <div class="meta-header">
                <span>Core Protocol // v10.0</span>
                <span>STABLE</span>
            </div>
            
            <h1>未来は、引き伸ばされる。</h1>
            
            <div class="input-wrapper">
                <input type="text" id="target-url" placeholder="Enter Destination URL" autocomplete="off" spellcheck="false">
            </div>
            
            <div class="trigger-zone">
                <span class="hint-text">Press Enter to Elongate</span>
                <button class="btn-elongate" onclick="generate()">Elongate</button>
            </div>
            
            <div id="result-box" class="hidden">
                <div class="result-controls">
                    <div class="result-title">High-Dimension URL Architecture</div>
                    <button class="btn-capture" id="copy-btn" onclick="copyResult()">Capture</button>
                </div>
                <div class="output-viewport">
                    <div id="result"></div>
                </div>
            </div>
        </div>

        <div id="redirector-view" class="hidden">
            <div class="quantum-field">
                <div class="quantum-wave"></div>
                <div class="quantum-core"></div>
            </div>
            <div class="redirect-status">Converging Dimension</div>
            <div class="redirect-sub">高次元URLを通常空間へ収束中。時空座標を復元しています。</div>
        </div>
    </div>

    <script>
        const inputField = document.getElementById('target-url');

        // Enterキー連動
        inputField.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                generate();
            }
        });

        // URL自動補完
        function autoCorrectScheme() {
            let val = inputField.value.trim();
            if (!val) return false;
            if (!/^https?:\/\//i.test(val)) {
                val = 'https://' + val;
                inputField.value = val;
            }
            return true;
        }

        inputField.addEventListener('blur', autoCorrectScheme);

        // --- コアロジック ---
        function makeRandomTrash(length) {
            const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let result = "";
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function elongateURL(targetUrl) {
            const base64 = btoa(unescape(encodeURIComponent(targetUrl)));
            let longPath = "";
            for (let char of base64) {
                const isUpperCase = char === char.toUpperCase() && char !== char.toLowerCase();
                const caseFlag = isUpperCase ? "BIG" : "sml";
                const prefixTrash = makeRandomTrash(3 + Math.floor(Math.random() * 6));
                const suffixTrash = makeRandomTrash(3 + Math.floor(Math.random() * 6));
                longPath += prefixTrash + caseFlag + char.toLowerCase() + suffixTrash + "_";
            }
            return window.location.href.split('?')[0] + "?url=" + longPath;
        }

        function restoreURL(longPath) {
            const chunks = longPath.split('_');
            let base64 = "";
            for (let chunk of chunks) {
                if (!chunk) continue;
                const isBig = chunk.includes("BIG");
                const marker = isBig ? "BIG" : "sml";
                const markerIndex = chunk.indexOf(marker);
                if (markerIndex !== -1) {
                    const charIndex = markerIndex + marker.length;
                    const realChar = chunk.charAt(charIndex);
                    base64 += isBig ? realChar.toUpperCase() : realChar;
                }
            }
            return decodeURIComponent(escape(atob(base64)));
        }

        // --- アプリケーションライフサイクル ---
        window.onload = function() {
            inputField.focus();
            const urlParams = new URLSearchParams(window.location.search);
            const longPath = urlParams.get('url');

            if (longPath) {
                document.getElementById('generator-view').classList.add('hidden');
                document.getElementById('redirector-view').classList.remove('hidden');
                
                try {
                    const destination = restoreURL(longPath);
                    setTimeout(() => {
                        window.location.href = destination;
                    }, 1500); // 1.5秒の控えめかつ上質なシネマティックディレイ
                } catch (e) {
                    window.location.href = window.location.href.split('?')[0];
                }
            }
        };

        function generate() {
            const hasContent = autoCorrectScheme();
            if (!hasContent) {
                inputField.classList.remove('error-pulse');
                void inputField.offsetWidth;
                inputField.classList.add('error-pulse');
                return;
            }

            const inputUrl = inputField.value;
            const btn = document.querySelector('.btn-elongate');
            btn.innerText = "PROCESSED";
            
            const longUrl = elongateURL(inputUrl);
            document.getElementById('result').innerText = longUrl;
            document.getElementById('result-box').classList.remove('hidden');
            
            const copyBtn = document.getElementById('copy-btn');
            copyBtn.innerText = "Capture";
            copyBtn.classList.remove('copied');
            
            setTimeout(() => { btn.innerText = "Elongate"; }, 1000);
        }

        // ボタン単体の静寂なインバートフィードバック
        function copyResult() {
            const resultText = document.getElementById('result').innerText;
            if (!resultText) return;

            navigator.clipboard.writeText(resultText).then(() => {
                const copyBtn = document.getElementById('copy-btn');
                copyBtn.innerText = "Captured";
                copyBtn.classList.add('copied');

                setTimeout(() => {
                    copyBtn.innerText = "Capture";
                    copyBtn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Capture failed', err);
            });
        }
    </script>
</body>
</html>
